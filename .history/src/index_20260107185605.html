<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 3D Viewer</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Multi-Dropdown Menu System -->
    <div class="menu-system-container">
        <!-- Exercise Menu -->
        <div class="menu-dropdown-wrapper">
            <button class="menu-toggle" id="exerciseToggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
                Exercise
            </button>
            <div class="menu-dropdown" id="exerciseDropdown">
                <div class="menu-scroll-controls">
                    <button class="scroll-btn" id="exerciseScrollUp">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14l5-5 5 5z"/>
                        </svg>
                    </button>
                    <button class="scroll-btn" id="exerciseScrollDown">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="menu-scroll-container" id="exerciseContainer">
                    <div class="menu-grid" id="exerciseGrid"></div>
                </div>
            </div>
        </div>

        <!-- Muscles Menu -->
        <div class="menu-dropdown-wrapper">
            <button class="menu-toggle" id="musclesToggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
                Muscles
            </button>
            <div class="menu-dropdown" id="musclesDropdown">
                <div class="menu-scroll-controls">
                    <button class="scroll-btn" id="musclesScrollUp">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14l5-5 5 5z"/>
                        </svg>
                    </button>
                    <button class="scroll-btn" id="musclesScrollDown">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="menu-scroll-container" id="musclesContainer">
                    <div class="menu-grid" id="musclesGrid"></div>
                </div>
            </div>
        </div>

        <!-- Equipment Menu -->
        <div class="menu-dropdown-wrapper">
            <button class="menu-toggle" id="equipmentToggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
                Equipment
            </button>
            <div class="menu-dropdown" id="equipmentDropdown">
                <div class="menu-scroll-controls">
                    <button class="scroll-btn" id="equipmentScrollUp">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14l5-5 5 5z"/>
                        </svg>
                    </button>
                    <button class="scroll-btn" id="equipmentScrollDown">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="menu-scroll-container" id="equipmentContainer">
                    <div class="menu-grid" id="equipmentGrid"></div>
                </div>
            </div>
        </div>

        <!-- Search Menu -->
        <div class="menu-dropdown-wrapper">
            <button class="menu-toggle" id="searchToggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                Search
            </button>
            <div class="menu-dropdown" id="searchDropdown">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search exercises..." class="search-input">
                    <button class="search-clear" id="searchClear">✕</button>
                </div>
                <div class="menu-scroll-container" id="searchContainer">
                    <div class="menu-grid" id="searchGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <canvas class="webgl"></canvas>
    
    <!-- Animation Player -->
    <div id="animation-player" class="animation-player" style="display: none;">
        <div class="player-controls">
            <button id="play-pause-btn" class="control-btn play-btn" title="Play/Pause">
                <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
            
            <div class="time-display">
                <span id="current-time">0:00</span>
            </div>
            
            <div class="timeline-container">
                <input type="range" id="timeline-slider" class="timeline-slider" min="0" max="100" value="0">
                <div class="timeline-progress"></div>
            </div>
            
            <div class="time-display">
                <span id="total-time">0:00</span>
            </div>
            
            <div class="speed-controls">
                <button id="speed-btn" class="control-btn speed-btn" title="Playback Speed">
                    <span id="speed-text">1x</span>
                </button>
                <div id="speed-menu" class="speed-menu">
                    <button class="speed-option" data-speed="0.25">0.25x</button>
                    <button class="speed-option" data-speed="0.5">0.5x</button>
                    <button class="speed-option active" data-speed="1">1x</button>
                    <button class="speed-option" data-speed="1.5">1.5x</button>
                    <button class="speed-option" data-speed="2">2x</button>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="./main.js"></script>
</body>
</html>
