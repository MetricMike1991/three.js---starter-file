<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 3D Viewer</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 2x2 Grid Thumbnail Menu System -->
    <div class="thumbnail-grid-container">
        <!-- Hover hint tab -->
        <div class="menu-hint-tab"></div>
        
        <!-- Top Row -->
        <div class="thumbnail-menu-wrapper">
            <button class="thumbnail-menu-toggle" id="exercisesToggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
                <span>Exercises</span>
            </button>
            <div class="thumbnail-dropdown" id="exercisesDropdown">
                <div class="thumbnail-scroll-controls">
                    <button class="scroll-btn" id="exercisesScrollUp">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14l5-5 5 5z"/>
                        </svg>
                    </button>
                    <button class="scroll-btn" id="exercisesScrollDown">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="thumbnail-scroll-container" id="exercisesContainer">
                    <div class="thumbnail-grid" id="exercisesGrid"></div>
                </div>
            </div>
        </div>

        <div class="thumbnail-menu-wrapper">
            <button class="thumbnail-menu-toggle" id="musclesToggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
                <span>Muscles</span>
            </button>
            <div class="thumbnail-dropdown" id="musclesDropdown">
                <div class="thumbnail-scroll-controls">
                    <button class="scroll-btn" id="musclesScrollUp">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14l5-5 5 5z"/>
                        </svg>
                    </button>
                    <button class="scroll-btn" id="musclesScrollDown">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="thumbnail-scroll-container" id="musclesContainer">
                    <div class="thumbnail-grid" id="musclesGrid"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Row -->
        <div class="thumbnail-menu-wrapper">
            <button class="thumbnail-menu-toggle" id="equipmentToggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
                <span>Equipment</span>
            </button>
            <div class="thumbnail-dropdown" id="equipmentDropdown">
                <div class="thumbnail-scroll-controls">
                    <button class="scroll-btn" id="equipmentScrollUp">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14l5-5 5 5z"/>
                        </svg>
                    </button>
                    <button class="scroll-btn" id="equipmentScrollDown">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="thumbnail-scroll-container" id="equipmentContainer">
                    <div class="thumbnail-grid" id="equipmentGrid"></div>
                </div>
            </div>
        </div>

        <div class="thumbnail-menu-wrapper">
            <button class="thumbnail-menu-toggle" id="informationToggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                <span>Information</span>
            </button>
            <div class="thumbnail-dropdown" id="informationDropdown">
                <div class="exercise-title-header" id="informationTitle">Select an Exercise</div>
                <div class="thumbnail-scroll-controls">
                    <button class="scroll-btn" id="informationScrollUp">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14l5-5 5 5z"/>
                        </svg>
                    </button>
                    <button class="scroll-btn" id="informationScrollDown">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="thumbnail-scroll-container" id="informationContainer">
                    <div class="thumbnail-grid" id="informationGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Side Menu System -->
    <div class="thumbnail-grid-container-right">
        <!-- Hover hint tab -->
        <div class="menu-hint-tab-right"></div>
        
        <!-- Top Row -->
        <div class="thumbnail-menu-wrapper">
            <button class="thumbnail-menu-toggle" id="info1Toggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                <span>Information 1</span>
            </button>
            <div class="thumbnail-dropdown-right" id="info1Dropdown">
                <div class="exercise-title-header" id="info1Title">Select an Exercise</div>
                <div class="thumbnail-scroll-controls">
                    <button class="scroll-btn" id="info1ScrollUp">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14l5-5 5 5z"/>
                        </svg>
                    </button>
                    <button class="scroll-btn" id="info1ScrollDown">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="thumbnail-scroll-container" id="info1Container">
                    <div class="thumbnail-grid" id="info1Grid"></div>
                </div>
            </div>
        </div>

        <div class="thumbnail-menu-wrapper">
            <button class="thumbnail-menu-toggle" id="info2Toggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                <span>Information 2</span>
            </button>
            <div class="thumbnail-dropdown-right" id="info2Dropdown">
                <div class="exercise-title-header" id="info2Title">Select an Exercise</div>
                <div class="thumbnail-scroll-controls">
                    <button class="scroll-btn" id="info2ScrollUp">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14l5-5 5 5z"/>
                        </svg>
                    </button>
                    <button class="scroll-btn" id="info2ScrollDown">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="thumbnail-scroll-container" id="info2Container">
                    <div class="thumbnail-grid" id="info2Grid"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Row -->
        <div class="thumbnail-menu-wrapper">
            <button class="thumbnail-menu-toggle" id="info3Toggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                <span>Information 3</span>
            </button>
            <div class="thumbnail-dropdown-right" id="info3Dropdown">
                <div class="exercise-title-header" id="info3Title">Select an Exercise</div>
                <div class="thumbnail-scroll-controls">
                    <button class="scroll-btn" id="info3ScrollUp">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14l5-5 5 5z"/>
                        </svg>
                    </button>
                    <button class="scroll-btn" id="info3ScrollDown">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="thumbnail-scroll-container" id="info3Container">
                    <div class="thumbnail-grid" id="info3Grid"></div>
                </div>
            </div>
        </div>

        <div class="thumbnail-menu-wrapper">
            <button class="thumbnail-menu-toggle" id="info4Toggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                <span>Information 4</span>
            </button>
            <div class="thumbnail-dropdown-right" id="info4Dropdown">
                <div class="exercise-title-header" id="info4Title">Select an Exercise</div>
                <div class="thumbnail-scroll-controls">
                    <button class="scroll-btn" id="info4ScrollUp">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14l5-5 5 5z"/>
                        </svg>
                    </button>
                    <button class="scroll-btn" id="info4ScrollDown">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="thumbnail-scroll-container" id="info4Container">
                    <div class="thumbnail-grid" id="info4Grid"></div>
                </div>
            </div>
        </div>
    </div>

    <canvas class="webgl"></canvas>
    
    <!-- Animation Player -->
    <div id="animation-player" class="animation-player" style="display: none;">
        <div class="player-controls">
            <button id="play-pause-btn" class="control-btn play-btn" title="Play/Pause">
                <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
            
            <div class="time-display">
                <span id="current-time">0:00</span>
            </div>
            
            <div class="timeline-container">
                <input type="range" id="timeline-slider" class="timeline-slider" min="0" max="100" value="0">
                <div class="timeline-progress"></div>
            </div>
            
            <div class="time-display">
                <span id="total-time">0:00</span>
            </div>
            
            <div class="speed-controls">
                <button id="speed-btn" class="control-btn speed-btn" title="Playback Speed">
                    <span id="speed-text">1x</span>
                </button>
                <div id="speed-menu" class="speed-menu">
                    <button class="speed-option" data-speed="0.25">0.25x</button>
                    <button class="speed-option" data-speed="0.5">0.5x</button>
                    <button class="speed-option active" data-speed="1">1x</button>
                    <button class="speed-option" data-speed="1.5">1.5x</button>
                    <button class="speed-option" data-speed="2">2x</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Right Menu Settings Panel -->
    <div class="right-menu-settings-panel" id="rightMenuSettingsPanel">
        <button class="right-menu-settings-toggle" id="rightMenuSettingsToggle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
            </svg>
        </button>
        
        <div class="right-menu-settings-content" id="rightMenuSettingsContent">
            <h3>Right Menu Settings</h3>
            
            <div class="settings-group">
                <label>Number of Info Tabs:</label>
                <div class="tab-count-buttons">
                    <button class="tab-count-btn" data-count="1">1</button>
                    <button class="tab-count-btn" data-count="2">2</button>
                    <button class="tab-count-btn" data-count="3">3</button>
                    <button class="tab-count-btn active" data-count="4">4</button>
                </div>
            </div>
            
            <div class="settings-group">
                <label>
                    <input type="checkbox" id="hideRightMenuToggle" checked>
                    Show Right Menu
                </label>
            </div>
            
            <div class="settings-group">
                <button class="export-settings-btn" id="exportRightMenuSettings">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/>
                    </svg>
                    Export Settings
                </button>
            </div>
        </div>
    </div>
    
    <script type="module" src="./main.js"></script>
</body>
</html>
