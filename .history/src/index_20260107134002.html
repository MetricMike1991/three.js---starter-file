<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 3D Viewer</title>
    <link rel="stylesheet" href="./src/style.css">
    <!-- Google Model Viewer for AR support -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
    <!-- AR Button -->
    <button id="see-in-ar" style="position: absolute; top: 20px; right: 20px; z-index: 10; padding: 12px 24px; font-size: 1.1rem; background: #fff; color: #222; border: none; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); cursor: pointer;">See in AR</button>
    <model-viewer id="ar-launcher"
      src="/models/exercise.glb"
      ios-src="/models/exercise.usdz"
      ar
      ar-modes="scene-viewer quick-look"
      style="display:none;">
    </model-viewer>

    <canvas class="webgl"></canvas>
    
    <!-- Animation Player -->
    <div id="animation-player" class="animation-player" style="display: none;">
        <div class="player-controls">
            <button id="play-pause-btn" class="control-btn play-btn" title="Play/Pause">
                <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
            
            <div class="time-display">
                <span id="current-time">0:00</span>
            </div>
            
            <div class="timeline-container">
                <input type="range" id="timeline-slider" class="timeline-slider" min="0" max="100" value="0">
                <div class="timeline-progress"></div>
            </div>
            
            <div class="time-display">
                <span id="total-time">0:00</span>
            </div>
            
            <div class="speed-controls">
                <button id="speed-btn" class="control-btn speed-btn" title="Playback Speed">
                    <span id="speed-text">1x</span>
                </button>
                <div id="speed-menu" class="speed-menu">
                    <button class="speed-option" data-speed="0.25">0.25x</button>
                    <button class="speed-option" data-speed="0.5">0.5x</button>
                    <button class="speed-option active" data-speed="1">1x</button>
                    <button class="speed-option" data-speed="1.5">1.5x</button>
                    <button class="speed-option" data-speed="2">2x</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
      document.getElementById('see-in-ar').addEventListener('click', () => {
        document.getElementById('ar-launcher').activateAR();
      });
    </script>
    <script type="module" src="./main.js"></script>
</body>
</html>
