<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View in AR - FlexFrame</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        .container { text-align: center; max-width: 400px; }
        .icon { margin-bottom: 24px; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
        p { color: rgba(255,255,255,0.7); font-size: 16px; margin-bottom: 32px; line-height: 1.5; }
        .ar-button {
            display: inline-block;
            background: linear-gradient(135deg, #4a9eff 0%, #2d7dd2 100%);
            color: white;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(74, 158, 255, 0.3);
            -webkit-tap-highlight-color: rgba(74, 158, 255, 0.3);
        }
        .ar-button:active { transform: scale(0.96); }
        .loading { display: none; margin-top: 24px; }
        .loading.show { display: block; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .device-info {
            margin-top: 32px;
            padding: 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            text-align: left;
            word-break: break-all;
        }
        .error { color: #ff6b6b; margin-top: 16px; display: none; }
        .error.show { display: block; }
        #ar-link { position: absolute; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
                <path d="M3 4v6h2V6h4V4H3zm18 0h-6v2h4v4h2V4zM3 20v-6h2v4h4v2H3zm18 0h-6v-2h4v-4h2v6z" fill="#4a9eff"/>
                <path d="M12 8l-4 6h3v4h2v-4h3l-4-6z" fill="#4a9eff"/>
            </svg>
        </div>
        <h1 id="page-title">View in Augmented Reality</h1>
        <p id="device-message">Detecting your device...</p>

        <button id="launch-ar" class="ar-button" style="display: none;">
            View in AR
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Launching AR...</p>
        </div>

        <p class="error" id="error"></p>
        <div class="device-info" id="device-info"></div>
    </div>

    <!-- Hidden AR Quick Look link for iOS -->
    <a id="ar-link" rel="ar" href="#">
        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="1" height="1">
    </a>

    <script>
        // Parse URL parameters
        var params = new URLSearchParams(window.location.search);
        var glbUrl = params.get('glb');
        var usdzUrl = params.get('usdz');
        var title = params.get('title') || 'Exercise';
        var exerciseName = title.replace(/_/g, ' ').replace(/\b\w/g, function(l) { return l.toUpperCase(); });

        // Branding parameters
        var websiteUrl = params.get('website') || 'https://thegymmanagerblog.com';
        var companyName = params.get('company') || 'FlexFrame';
        var callToAction = params.get('cta') || 'Visit ' + companyName;

        // DOM elements
        var deviceMessage = document.getElementById('device-message');
        var launchButton = document.getElementById('launch-ar');
        var loading = document.getElementById('loading');
        var error = document.getElementById('error');
        var deviceInfo = document.getElementById('device-info');
        var arLink = document.getElementById('ar-link');

        // Set title
        document.getElementById('page-title').textContent = exerciseName;

        // Detect device
        function getDeviceType() {
            var ua = navigator.userAgent.toLowerCase();
            if (/iphone|ipad|ipod/.test(ua)) return 'ios';
            if (/android/.test(ua)) return 'android';
            return 'desktop';
        }

        // ============================================================
        // Try multiple Scene Viewer launch methods
        // Method 1: HTTPS link (Chrome handles redirect to Scene Viewer)
        // Method 2: intent:// with com.google.ar.core
        // Method 3: intent:// with com.google.android.googlequicksearchbox (v33)
        // ============================================================
        function buildSceneViewerHttpsUrl(fileUrl) {
            var sceneViewerParams = [
                'file=' + encodeURIComponent(fileUrl),
                'mode=ar_preferred',
                'title=' + encodeURIComponent(title)
            ];
            if (websiteUrl) {
                sceneViewerParams.push('link=' + encodeURIComponent(websiteUrl));
            }
            return 'https://arvr.google.com/scene-viewer/1.0?' + sceneViewerParams.join('&');
        }

        function buildIntentArCore(fileUrl) {
            var sceneViewerParams = [
                'file=' + encodeURIComponent(fileUrl),
                'mode=ar_preferred',
                'title=' + encodeURIComponent(title)
            ];
            return 'intent://arvr.google.com/scene-viewer/1.0?' +
                sceneViewerParams.join('&') +
                '#Intent;scheme=https;package=com.google.ar.core;' +
                'action=android.intent.action.VIEW;' +
                'S.browser_fallback_url=' + encodeURIComponent(fileUrl) + ';end;';
        }

        function buildIntentGoogleApp(fileUrl) {
            var sceneViewerParams = [
                'file=' + encodeURIComponent(fileUrl),
                'mode=ar_preferred',
                'title=' + encodeURIComponent(title)
            ];
            return 'intent://arvr.google.com/scene-viewer/1.0?' +
                sceneViewerParams.join('&') +
                '#Intent;scheme=https;package=com.google.android.googlequicksearchbox;' +
                'action=android.intent.action.VIEW;' +
                'S.browser_fallback_url=' + encodeURIComponent(fileUrl) + ';end;';
        }

        // iOS AR Quick Look URL with branding
        function buildIOSArUrl(baseUrl) {
            var hashParams = [];
            if (websiteUrl) {
                hashParams.push('callToAction=' + encodeURIComponent(callToAction));
                hashParams.push('checkoutTitle=' + encodeURIComponent(companyName));
                hashParams.push('checkoutSubtitle=' + encodeURIComponent('Tap to visit website'));
                hashParams.push('canonicalWebPageURL=' + encodeURIComponent(websiteUrl));
            }
            if (hashParams.length > 0) {
                return baseUrl + '#' + hashParams.join('&');
            }
            return baseUrl;
        }

        var deviceType = getDeviceType();

        // Debug info
        var debugLines = [];
        debugLines.push('<b>Device:</b> ' + deviceType.toUpperCase());
        debugLines.push('<b>GLB:</b> ' + (glbUrl ? glbUrl.substring(glbUrl.lastIndexOf('/') + 1) : 'MISSING'));
        debugLines.push('<b>USDZ:</b> ' + (usdzUrl ? '✓' : '✗'));
        if (glbUrl) {
            debugLines.push('<b>Full GLB URL:</b> ' + glbUrl);
        }
        deviceInfo.innerHTML = debugLines.join('<br>');

        // Configure based on device
        if (!glbUrl && !usdzUrl) {
            deviceMessage.textContent = 'No AR model available';
            error.textContent = 'Error: No model URLs provided';
            error.classList.add('show');

        } else if (deviceType === 'ios') {
            if (usdzUrl) {
                deviceMessage.textContent = 'Tap the button to view in AR.';
                launchButton.style.display = 'inline-block';
                arLink.href = buildIOSArUrl(usdzUrl);
                launchButton.addEventListener('click', function() {
                    loading.classList.add('show');
                    arLink.click();
                    setTimeout(function() { loading.classList.remove('show'); }, 2000);
                });
            } else if (glbUrl) {
                deviceMessage.textContent = 'iOS detected, but only GLB available.';
                launchButton.style.display = 'inline-block';
                launchButton.textContent = 'Try AR (GLB)';
                arLink.href = buildIOSArUrl(glbUrl);
                launchButton.addEventListener('click', function() { arLink.click(); });
            }

        } else if (deviceType === 'android') {
            if (glbUrl) {
                // Build all three URL variants
                var httpsUrl = buildSceneViewerHttpsUrl(glbUrl);
                var intentArCore = buildIntentArCore(glbUrl);
                var intentGoogleApp = buildIntentGoogleApp(glbUrl);

                debugLines.push('<br><b>Method:</b> 3 buttons below');
                deviceInfo.innerHTML = debugLines.join('<br>');

                deviceMessage.textContent = 'Try each button to find which AR method works on your device:';

                // Hide the original button, we'll make 3 custom ones
                launchButton.style.display = 'none';

                // Create 3 buttons for the 3 methods
                var btnContainer = document.createElement('div');
                btnContainer.style.cssText = 'display:flex;flex-direction:column;gap:12px;margin-top:16px;align-items:center;';

                var btn1 = document.createElement('button');
                btn1.textContent = '① HTTPS Link (Recommended)';
                btn1.style.cssText = 'padding:14px 28px;font-size:16px;font-weight:bold;border:none;border-radius:12px;background:#4CAF50;color:white;cursor:pointer;width:280px;';
                btn1.addEventListener('click', function() {
                    deviceInfo.innerHTML += '<br><b>Trying:</b> HTTPS link...';
                    window.location.href = httpsUrl;
                });

                var btn2 = document.createElement('button');
                btn2.textContent = '② Intent → ARCore';
                btn2.style.cssText = 'padding:14px 28px;font-size:16px;font-weight:bold;border:none;border-radius:12px;background:#2196F3;color:white;cursor:pointer;width:280px;';
                btn2.addEventListener('click', function() {
                    deviceInfo.innerHTML += '<br><b>Trying:</b> Intent ARCore...';
                    window.location.href = intentArCore;
                });

                var btn3 = document.createElement('button');
                btn3.textContent = '③ Intent → Google App (v33)';
                btn3.style.cssText = 'padding:14px 28px;font-size:16px;font-weight:bold;border:none;border-radius:12px;background:#FF9800;color:white;cursor:pointer;width:280px;';
                btn3.addEventListener('click', function() {
                    deviceInfo.innerHTML += '<br><b>Trying:</b> Intent Google App...';
                    window.location.href = intentGoogleApp;
                });

                btnContainer.appendChild(btn1);
                btnContainer.appendChild(btn2);
                btnContainer.appendChild(btn3);
                launchButton.parentNode.insertBefore(btnContainer, launchButton);
            } else {
                deviceMessage.textContent = 'Android detected, but no GLB model available.';
                error.textContent = 'GLB model required for Android AR';
                error.classList.add('show');
            }

        } else {
            deviceMessage.textContent = 'Please open this page on your mobile device to view in AR.';
        }
    </script>
</body>
</html>
