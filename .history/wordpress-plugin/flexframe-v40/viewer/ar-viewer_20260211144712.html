<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View in AR - FlexFrame</title>
    <!-- Google model-viewer: handles WebXR AR -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            padding: 24px;
        }

        /* AR icon */
        .ar-icon {
            margin-bottom: 20px;
        }

        /* Title */
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }
        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 32px;
            text-align: center;
        }

        /* Gesture instructions */
        .gestures {
            width: 100%;
            max-width: 340px;
            margin-bottom: 36px;
        }
        .gesture {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .gesture:last-child { border-bottom: none; }
        .gesture-icon {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            background: rgba(74, 158, 255, 0.12);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gesture-text {
            flex: 1;
        }
        .gesture-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 3px;
        }
        .gesture-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            line-height: 1.4;
        }

        /* AR launch button */
        .ar-button {
            background: linear-gradient(135deg, #4a9eff 0%, #2d7dd2 100%);
            color: white;
            padding: 16px 48px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(74, 158, 255, 0.35);
            letter-spacing: 0.3px;
            display: none;
        }
        .ar-button:active { transform: scale(0.96); }
        .ar-button.show { display: inline-block; }

        /* Loading state */
        .loading-msg {
            margin-top: 20px;
            display: none;
            align-items: center;
            gap: 12px;
        }
        .loading-msg.show { display: flex; }
        .spinner {
            width: 24px; height: 24px;
            border: 2.5px solid rgba(255,255,255,0.15);
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-msg span { color: rgba(255,255,255,0.6); font-size: 14px; }

        /* Error */
        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 16px;
            display: none;
            text-align: center;
        }
        .error-msg.show { display: block; }

        /* Hidden model-viewer — just used as AR launcher, no visible preview */
        model-viewer {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* iOS Quick Look link (hidden) */
        #ios-ar-link { position: absolute; opacity: 0; pointer-events: none; }

        /* Debug panel */
        .debug {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 12px;
            background: rgba(0,0,0,0.5);
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            text-align: left;
            word-break: break-all;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- AR Icon -->
    <div class="ar-icon">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
            <path d="M3 4v6h2V6h4V4H3zm18 0h-6v2h4v4h2V4zM3 20v-6h2v4h4v2H3zm18 0h-6v-2h4v-4h2v6z" fill="#4a9eff"/>
            <path d="M12 8l-4 6h3v4h2v-4h3l-4-6z" fill="#4a9eff"/>
        </svg>
    </div>

    <h1 id="page-title">View in AR</h1>
    <p class="subtitle" id="subtitle">Loading model...</p>

    <!-- Gesture Controls Guide -->
    <div class="gestures" id="gestures" style="display:none;">
        <div class="gesture">
            <div class="gesture-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <circle cx="10" cy="14" r="2.5" stroke="#4a9eff" stroke-width="1.5" fill="none"/>
                    <circle cx="16" cy="10" r="2.5" stroke="#4a9eff" stroke-width="1.5" fill="none"/>
                    <path d="M10 11.5V7M16 7.5V4" stroke="#4a9eff" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="gesture-text">
                <div class="gesture-title">2 Fingers — Rotate & Scale</div>
                <div class="gesture-desc">Pinch to resize the model. Twist two fingers to rotate it in place.</div>
            </div>
        </div>

        <div class="gesture">
            <div class="gesture-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="13" r="2.5" stroke="#4a9eff" stroke-width="1.5" fill="none"/>
                    <path d="M12 10.5V5" stroke="#4a9eff" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M8 18h8" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="2 2"/>
                    <path d="M9 20l3-2 3 2" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>
                </svg>
            </div>
            <div class="gesture-text">
                <div class="gesture-title">1 Finger — Reposition</div>
                <div class="gesture-desc">Tap and drag the white indicator on the floor to move the model around your room.</div>
            </div>
        </div>
    </div>

    <!-- Launch Button -->
    <button class="ar-button" id="launch-btn">✨ View in Your Room</button>

    <!-- Loading indicator -->
    <div class="loading-msg" id="loading-msg">
        <div class="spinner"></div>
        <span id="loading-text">Loading model...</span>
    </div>

    <!-- Error message -->
    <p class="error-msg" id="error-msg"></p>

    <!-- Hidden model-viewer (AR launcher only, no visible preview) -->
    <model-viewer
        id="viewer"
        ar
        ar-modes="webxr scene-viewer quick-look"
        loading="eager"
    >
    </model-viewer>

    <!-- Hidden iOS Quick Look link -->
    <a id="ios-ar-link" rel="ar" href="#">
        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="1" height="1">
    </a>

    <div class="debug" id="debug"></div>

    <script type="module">
        // ============================================================
        // URL Parameters
        // ============================================================
        const params = new URLSearchParams(window.location.search);
        const glbUrl = params.get('glb');
        const usdzUrl = params.get('usdz');
        const title = params.get('title') || 'Exercise';
        const exerciseName = title.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        const websiteUrl = params.get('website') || '';
        const companyName = params.get('company') || 'FlexFrame';
        const callToAction = params.get('cta') || 'Visit Website';

        // DOM
        const viewer = document.getElementById('viewer');
        const pageTitle = document.getElementById('page-title');
        const subtitle = document.getElementById('subtitle');
        const gesturesDiv = document.getElementById('gestures');
        const launchBtn = document.getElementById('launch-btn');
        const loadingMsg = document.getElementById('loading-msg');
        const loadingText = document.getElementById('loading-text');
        const errorMsg = document.getElementById('error-msg');
        const debugDiv = document.getElementById('debug');

        let modelLoaded = false;

        function log(msg) {
            console.log('[AR]', msg);
            debugDiv.innerHTML += (debugDiv.innerHTML ? '<br>' : '') + msg;
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }

        function getDevice() {
            const ua = navigator.userAgent || '';
            if (/iPad|iPhone|iPod/.test(ua)) return 'ios';
            if (/android/i.test(ua)) return 'android';
            return 'desktop';
        }

        const device = getDevice();
        pageTitle.textContent = exerciseName;
        log(device + ' | GLB: ' + (glbUrl ? 'yes' : 'no') + ' | USDZ: ' + (usdzUrl ? 'yes' : 'no'));

        // ============================================================
        // No model available
        // ============================================================
        if (!glbUrl && !usdzUrl) {
            subtitle.textContent = 'No AR model available.';
            showError('No model URLs provided in the link.');

        // ============================================================
        // Load model into hidden model-viewer
        // ============================================================
        } else {
            // Set sources
            if (glbUrl) viewer.setAttribute('src', glbUrl);
            if (usdzUrl) viewer.setAttribute('ios-src', usdzUrl);

            // Show loading
            loadingMsg.classList.add('show');
            subtitle.textContent = 'Preparing your AR experience...';

            // Model loaded → show gesture guide + button
            viewer.addEventListener('load', () => {
                modelLoaded = true;
                log('✓ Model loaded');
                loadingMsg.classList.remove('show');
                subtitle.textContent = 'Ready! Review the controls, then tap the button below.';
                gesturesDiv.style.display = 'block';
                launchBtn.classList.add('show');
            });

            // Model error
            viewer.addEventListener('error', (e) => {
                const msg = e.detail ? (e.detail.type || e.detail) : 'unknown';
                log('✗ Error: ' + msg);
                loadingMsg.classList.remove('show');
                subtitle.textContent = 'Failed to load the model.';
                showError('Could not load the 3D model. Please try again.');
            });

            // AR status tracking
            viewer.addEventListener('ar-status', (e) => {
                const status = e.detail.status;
                log('AR: ' + status);
                if (status === 'session-started') {
                    loadingMsg.classList.remove('show');
                } else if (status === 'not-presenting') {
                    loadingMsg.classList.remove('show');
                } else if (status === 'failed') {
                    loadingMsg.classList.remove('show');
                    showError('AR could not start. Your device may not support AR.');
                }
            });

            // ============================================================
            // Launch AR button
            // ============================================================
            launchBtn.addEventListener('click', () => {
                if (!modelLoaded) return;
                log('Launching AR...');
                loadingText.textContent = 'Starting AR...';
                loadingMsg.classList.add('show');

                // Trigger model-viewer's AR activation
                viewer.activateAR();
            });
        }
    </script>
</body>
</html>
