<body>
    <!-- Loading Spinner -->
    <div id="model-loader" class="model-loader" style="display: none;">
        <!-- GRADIENT SPINNER -->
        <div class="spinner-box" data-spinner="gradient">
            <div class="circle-border">
                <div class="circle-core"></div>
            </div>
        </div>

        <!-- SPINNER ORBITS -->
        <div class="spinner-box" data-spinner="orbits">
            <div class="blue-orbit leo"></div>
            <div class="green-orbit leo"></div>
            <div class="red-orbit leo"></div>
            <div class="white-orbit w1 leo"></div>
            <div class="white-orbit w2 leo"></div>
            <div class="white-orbit w3 leo"></div>
        </div>

        <!-- GRADIENT CIRCLE PLANES -->
        <div class="spinner-box" data-spinner="planes">
            <div class="leo-border-1">
                <div class="leo-core-1"></div>
            </div>
            <div class="leo-border-2">
                <div class="leo-core-2"></div>
            </div>
        </div>

        <!-- SPINNING SQUARES -->
        <div class="spinner-box" data-spinner="squares">
            <div class="configure-border-1">
                <div class="configure-core"></div>
            </div>
            <div class="configure-border-2">
                <div class="configure-core"></div>
            </div>
        </div>

        <!-- LOADING DOTS... -->
        <div class="spinner-box" data-spinner="dots">
            <div class="pulse-container">
                <div class="pulse-bubble pulse-bubble-1"></div>
                <div class="pulse-bubble pulse-bubble-2"></div>
                <div class="pulse-bubble pulse-bubble-3"></div>
            </div>
        </div>

        <!-- SOLAR SYSTEM -->
        <div class="spinner-box" data-spinner="solar">
            <div class="solar-system">
                <div class="earth-orbit orbit">
                    <div class="planet earth"></div>
                    <div class="venus-orbit orbit">
                        <div class="planet venus"></div>
                        <div class="mercury-orbit orbit">
                            <div class="planet mercury"></div>
                            <div class="sun"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- THREE QUARTER SPINNER -->
        <div class="spinner-box" data-spinner="quarter">
            <div class="three-quarter-spinner"></div>
        </div>

        <!-- ORIGINAL COOL SPINNER -->
        <div class="spinner-box" data-spinner="cool">
            <div class="loader-spinner"></div>
        </div>

        <div class="loader-text">Loading Model...</div>
    </div>

                </div>
            </div>
        </div>

    <!-- Fullscreen Button -->
    <button id="fullscreen-btn" class="fullscreen-btn" title="Toggle Fullscreen">
        <svg class="fullscreen-enter-icon" viewBox="0 0 24 24" width="18" height="18">
            <!-- Expand icon -->
            <path fill="white" d="M5 5h5v2H7v3H5V5zm14 0v5h-2V7h-3V5h5zM5 19v-5h2v3h3v2H5zm14 0h-5v-2h3v-3h2v5z"/>

    <!-- Animation Player -->
    <div id="animation-player" class="animation-player" style="display: none;">
        <div class="player-controls">
            <button id="play-pause-btn" class="control-btn play-btn" title="Play/Pause">

                    <path d="M8 5v14l11-7z"/>

                </svg>
            </button>

            <div class="timeline-container">

                <div class="timeline-progress"></div>
            </div>
            
            <div class="time-display">
                <span id="total-time">0:00</span>
            </div>
            
            <button id="quality-toggle-btn" class="control-btn quality-btn" title="Switch Model Quality" style="display: none;">

                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>

            </button>

                    <span id="speed-text">1x</span>

                    <button class="speed-option active" data-speed="1">1x</button>
                    <button class="speed-option" data-speed="1.5">1.5x</button>
                    <button class="speed-option" data-speed="2">2x</button>
                </div>
            </div>
