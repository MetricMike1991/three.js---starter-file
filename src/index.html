<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 3D Viewer</title>
    <link rel="stylesheet" href="./src/style.css">
    <!-- Google Model Viewer for AR support -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
    <!-- <canvas class="webgl"></canvas> -->
    <model-viewer
      src="/models/exercise.glb"
      ar
      ar-modes="scene-viewer quick-look"
      camera-controls
      auto-rotate
      style="width: 100vw; height: 100vh; background: transparent;">
      <button slot="ar-button" style="position: absolute; top: 20px; right: 20px; z-index: 10; padding: 12px 24px; font-size: 1.1rem; background: #fff; color: #222; border: none; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); cursor: pointer;">
        View in AR
      </button>
    </model-viewer>
</body>
</html>
